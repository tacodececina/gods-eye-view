<div id="left-panel-stack">
  <!-- Data Layer Toggle Panel -->
  <div id="data-panel" class="panel-collapsible collapsed active" data-panel-id="data-panel">
    <div class="panel-glow"></div>
    <div class="data-panel-inner">
      <div class="panel-header">
        <span class="panel-title">CAPAS DISPONIBLES</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="data-panel" title="Cerrar panel">+</button>
      </div>
      <div id="data-toggles" class="data-toggle-list"></div>
    </div>
  </div>

  <!-- CCTV Coverage Panel -->
  <div id="cctv-panel" class="panel-collapsible collapsed" data-panel-id="cctv-panel">
    <div class="panel-glow"></div>
    <div class="cctv-panel-inner">
      <div class="panel-header">
        <span class="panel-title">CCTV</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="cctv-panel" title="Cerrar panel">+</button>
      </div>
      <div id="cctv-frame-wrap" class="cctv-frame-wrap">
        <img id="cctv-frame" alt="CCTV feed frame" />
      </div>
      <div id="cctv-source-badge" role="status" aria-live="polite">FUENTE · SIN CONSULTAR</div>
      <div id="cctv-meta">Catálogo de cámaras no configurado</div>
      <div class="cctv-controls">
        <button id="cctv-enable-btn" class="scene-btn">CÁMARAS APAGADAS</button>
        <button id="cctv-nearest-btn" class="scene-btn">CERCANA</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-prev-btn" class="scene-btn">ANTERIOR</button>
        <select id="cctv-camera-select" aria-label="CCTV camera"></select>
        <button id="cctv-next-btn" class="scene-btn">SIGUIENTE</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-focus-btn" class="scene-btn">ENCUADRAR</button>
        <button id="cctv-coverage-btn" class="scene-btn">COBERTURA APAGADA</button>
        <button id="cctv-auto-hop-btn" class="scene-btn">RECORRIDO APAGADO</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-projection-btn" class="scene-btn">PROYECCIÓN ACTIVA</button>
        <span id="cctv-quality-chip">CAL · --</span>
      </div>
      <div class="cctv-calibration-block">
        <div class="cctv-calibration-header">
          <div class="cctv-summary-label">CALIBRACIÓN</div>
          <button id="cctv-adjust-btn" class="scene-btn" title="Drag the camera in the world: rings rotate, arrows move, handles set range/FOV">AJUSTAR</button>
        </div>
        <div id="cctv-cal-readout" class="cctv-cal-readout" aria-label="Camera pose — click a value to type">
          <button class="cctv-cal-value" data-cal-field="heading" title="Heading (compass °) — click to type">RUMBO —</button>
          <button class="cctv-cal-value" data-cal-field="pitch" title="Pitch (° up/down) — click to type">INCLINACIÓN —</button>
          <button class="cctv-cal-value" data-cal-field="fov" title="Horizontal FOV (°) — click to type">FOV --</button>
          <button class="cctv-cal-value" data-cal-field="range" title="Range / monitor-plane distance (m) — click to type">DISTANCIA —</button>
          <button class="cctv-cal-value" data-cal-field="height" title="Mount height above ground (m) — click to type">ALTURA —</button>
          <button class="cctv-cal-value" data-cal-field="north" title="North offset from catalog position (m) — click to type">ΔN --</button>
          <button class="cctv-cal-value" data-cal-field="east" title="East offset from catalog position (m) — click to type">ΔE --</button>
        </div>
        <div class="cctv-controls cctv-calibration-actions">
          <button id="cctv-calib-save-btn" class="scene-btn">GUARDAR CAL.</button>
          <button id="cctv-calib-reset-btn" class="scene-btn">RESTABLECER CAL.</button>
        </div>
      </div>
      <div class="cctv-summary-label">CONTEXTO</div>
      <div id="cctv-summary">Los resúmenes de cámaras necesitan un servicio configurado.</div>
    </div>
  </div>

  <!-- Scene Director Panel -->
  <div id="scene-panel" class="panel-collapsible collapsed" data-panel-id="scene-panel">
    <div class="panel-glow"></div>
    <div class="scene-panel-inner">
      <div class="panel-header">
        <span class="panel-title">ESCENAS</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="scene-panel" title="Cerrar panel">+</button>
      </div>
      <div class="scene-controls">
        <select id="scene-select" aria-label="Scene recipe"></select>
        <button id="scene-new-btn" class="scene-btn">NUEVA</button>
        <button id="scene-delete-btn" class="scene-btn scene-btn-danger">BORRAR</button>
      </div>
      <div class="scene-controls">
        <button id="scene-capture-btn" class="scene-btn">CAPTURAR VISTA</button>
        <button id="scene-update-shot-btn" class="scene-btn">ACTUALIZAR VISTA</button>
      </div>
      <div id="scene-shot-list" class="scene-shot-list"></div>
      <div class="scene-controls">
        <button id="scene-start-btn" class="scene-btn">REPRODUCIR</button>
        <button id="scene-stop-btn" class="scene-btn scene-btn-danger">DETENER</button>
        <button id="scene-next-btn" class="scene-btn">SIGUIENTE</button>
      </div>
      <div class="scene-controls">
        <button id="scene-export-btn" class="scene-btn">EXPORTAR</button>
        <button id="scene-import-btn" class="scene-btn">IMPORTAR</button>
        <button id="scene-download-btn" class="scene-btn">REGISTRO</button>
        <input type="file" id="scene-import-file" accept="application/json,.json" hidden />
      </div>
      <div class="scene-progress">
        <div id="scene-progress-fill">0%</div>
      </div>
      <div id="scene-status">Listo</div>
    </div>
  </div>
</div>
