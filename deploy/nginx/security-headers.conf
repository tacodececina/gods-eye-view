# Included in every server/location that uses add_header, because nginx drops
# inherited add_header directives as soon as a block declares its own.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# CSP sources:
#  default-src 'self'            baseline.
#  script-src 'self' 'wasm-unsafe-eval'
#                                Vite bundles are same-origin; Cesium/Draco decoders compile WebAssembly.
#  worker-src 'self' blob:       Cesium spawns Web Workers, some from blob: URLs.
#  img-src 'self' data: blob: https:
#                                imagery/tiles/icons from providers (Google, Cesium ion, OSM...), data:/blob: textures.
#  connect-src 'self' https: wss:
#                                Google Photorealistic 3D Tiles, Cesium ion and other HTTPS feeds; wss: for OpenAI Realtime and AIS streams.
#  media-src 'self' blob: https: CCTV/radio streams.
#  style-src 'self' 'unsafe-inline'
#                                Cesium widgets set inline styles.
#  font-src 'self' data:         bundled fonts.
#  frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
